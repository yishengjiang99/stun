<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P2P WebRTC Face Box</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- MediaPipe Tasks Vision bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
          crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">P2P FaceBox</div>
    <div class="controls">
      <input id="roomInput" placeholder="Room ID" value="demo-room" />
      <button id="joinBtn">Join</button>
      <button id="leaveBtn" disabled>Leave</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>Rooms</h2>
      <div class="room-meta">
        <span>Selected:</span>
        <span id="currentRoom">Not joined</span>
      </div>
      <div class="room-meta">
        <span>Participants:</span>
        <span id="currentRoomCount">0</span>
      </div>
      <ul id="roomList" class="room-list"></ul>
    </section>

    <section class="panel">
      <h2>Local</h2>
      <div class="video-wrap hidden" id="localWrap">
        <video id="localVideo" autoplay playsinline muted></video>
        <canvas id="localCanvas"></canvas>
      </div>
      <div class="status" id="localStatus">Not connected</div>
    </section>

    <section class="panel">
      <h2>Remote</h2>
      <div id="remoteGrid" class="remote-grid hidden"></div>
      <div class="status" id="remoteStatus">No peers</div>
    </section>
  </main>

  <footer class="footer">
    Object detection uses MediaPipe ObjectDetector. Face detection uses the browser FaceDetector API if available.
  </footer>

  <script type="module" src="client.js"></script>
</body>
</html>
